<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beihilfe- & Rechnungsmanager</title>
    <!-- Tailwind CSS für modernes Design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome für Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <div class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
        <!-- Header -->
        <header class="flex flex-col sm:flex-row justify-between items-center mb-8 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <div>
                <h1 class="text-2xl font-bold text-gray-900"><i class="fa-solid fa-file-medical text-blue-600 mr-2"></i> Beihilfe- & Rechnungsmanager</h1>
                <p class="text-sm text-gray-500 mt-1">Übersicht und Abrechnung (LBV / PKV)</p>
            </div>
            <div class="mt-4 sm:mt-0 flex gap-3">
                <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-sm flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> Neue Rechnung
                </button>
                <button onclick="exportData()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-xl text-sm font-medium transition flex items-center gap-2">
                    <i class="fa-solid fa-download"></i> Export
                </button>
            </div>
        </header>

        <!-- Statistik-Karten -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
            <div class="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm">
                <p class="text-sm font-medium text-gray-500">Gesamtsumme Rechnungen</p>
                <p id="totalSum" class="text-2xl font-bold text-gray-900 mt-1">0,00 €</p>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm">
                <p class="text-sm font-medium text-gray-500">Erwartet LBV (70%)</p>
                <p id="totalLbv" class="text-2xl font-bold text-blue-600 mt-1">0,00 €</p>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm">
                <p class="text-sm font-medium text-gray-500">Erwartet PKV (30%)</p>
                <p id="totalPkv" class="text-2xl font-bold text-indigo-600 mt-1">0,00 €</p>
            </div>
        </div>

        <!-- Haupttabelle -->
        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-gray-500 text-xs uppercase tracking-wider border-b border-gray-100">
                            <th class="p-4 font-semibold">Termin</th>
                            <th class="p-4 font-semibold">Re.-Datum</th>
                            <th class="p-4 font-semibold">Rechnungsaussteller</th>
                            <th class="p-4 font-semibold text-right">Betrag</th>
                            <th class="p-4 font-semibold">Zahlungsziel</th>
                            <th class="p-4 font-semibold">Bezahlt am</th>
                            <th class="p-4 font-semibold text-right">LBV (70%)</th>
                            <th class="p-4 font-semibold text-right">PKV (30%)</th>
                            <th class="p-4 font-semibold text-center">Aktion</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-gray-100 text-sm">
                        <!-- Wird per JS gefüllt -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal zum Hinzufügen -->
    <div id="invoiceModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-gray-900">Neue Rechnung erfassen</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="invoiceForm" onsubmit="addInvoice(event)" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Termin</label>
                        <input type="date" id="termin" class="w-full border border-gray-200 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Rechnungsdatum</label>
                        <input type="date" id="reDatum" class="w-full border border-gray-200 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none" required>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Rechnungsaussteller</label>
                    <input type="text" id="aussteller" placeholder="z.B. Praxis Dr. Müller" class="w-full border border-gray-200 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none" required>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Betrag (€)</label>
                        <input type="number" step="0.01" id="betrag" placeholder="0.00" class="w-full border border-gray-200 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none" required>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Zahlungsziel</label>
                        <input type="date" id="zahlungsziel" class="w-full border border-gray-200 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Bezahlt am (optional)</label>
                    <input type="date" id="bezahltAm" class="w-full border border-gray-200 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-sm font-medium text-gray-600 hover:bg-gray-100">Abbrechen</button>
                    <button type="submit" class="px-4 py-2 rounded-xl text-sm font-medium bg-blue-600 text-white hover:bg-blue-700 shadow-sm">Speichern</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Logik -->
    <script>
        let invoices = JSON.parse(localStorage.getItem('beihilfe_invoices')) || [
            { id: 1, termin: '2026-03-01', reDatum: '2026-03-02', aussteller: 'Beispiel Arzt', betrag: 150.00, zahlungsziel: '2026-03-20', bezahltAm: '2026-03-05' }
        ];

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            let totalSum = 0;
            let totalLbv = 0;
            let totalPkv = 0;

            if (invoices.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" class="p-6 text-center text-gray-400">Keine Rechnungen vorhanden.</td></tr>`;
                return;
            }

            invoices.forEach(inv => {
                const betrag = parseFloat(inv.betrag) || 0;
                const lbv = betrag * 0.70;
                const pkv = betrag * 0.30;

                totalSum += betrag;
                totalLbv += lbv;
                totalPkv += pkv;

                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50/50 transition";
                tr.innerHTML = `
                    <td class="p-4 text-gray-600">${inv.termin || '-'}</td>
                    <td class="p-4 text-gray-600">${inv.reDatum || '-'}</td>
                    <td class="p-4 font-medium text-gray-900">${inv.aussteller}</td>
                    <td class="p-4 text-right font-semibold text-gray-900">${betrag.toFixed(2)} €</td>
                    <td class="p-4 text-gray-600">${inv.zahlungsziel || '-'}</td>
                    <td class="p-4 text-gray-600">${inv.bezahltAm ? '<span class="text-green-600 font-medium"><i class="fa-solid fa-check mr-1"></i>' + inv.bezahltAm + '</span>' : '<span class="text-amber-500">Offen</span>'}</td>
                    <td class="p-4 text-right text-blue-600 font-medium">${lbv.toFixed(2)} €</td>
                    <td class="p-4 text-right text-indigo-600 font-medium">${pkv.toFixed(2)} €</td>
                    <td class="p-4 text-center">
                        <button onclick="deleteInvoice(${inv.id})" class="text-gray-400 hover:text-red-600 transition"><i class="fa-solid fa-trash-can"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('totalSum').innerText = totalSum.toFixed(2) + ' €';
            document.getElementById('totalLbv').innerText = totalLbv.toFixed(2) + ' €';
            document.getElementById('totalPkv').innerText = totalPkv.toFixed(2) + ' €';
        }

        function openModal() { document.getElementById('invoiceModal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('invoiceModal').classList.add('hidden'); document.getElementById('invoiceForm').reset(); }

        function addInvoice(e) {
            e.preventDefault();
            const newInv = {
                id: Date.now(),
                termin: document.getElementById('termin').value,
                reDatum: document.getElementById('reDatum').value,
                aussteller: document.getElementById('aussteller').value,
                betrag: parseFloat(document.getElementById('betrag').value),
                zahlungsziel: document.getElementById('zahlungsziel').value,
                bezahltAm: document.getElementById('bezahltAm').value
            };
            invoices.push(newInv);
            localStorage.setItem('beihilfe_invoices', JSON.stringify(invoices));
            closeModal();
            renderTable();
        }

        function deleteInvoice(id) {
            if(confirm('Möchten Sie diesen Eintrag wirklich löschen?')) {
                invoices = invoices.filter(inv => inv.id !== id);
                localStorage.setItem('beihilfe_invoices', JSON.stringify(invoices));
                renderTable();
            }
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(invoices, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "beihilfe_export.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        renderTable();
    </script>
</body>
</html>
